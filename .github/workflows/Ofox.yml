name: Build OrangeFox Recovery R12 for Sony Xperia XZ Premium (maple)

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'maple'
      DEVICE_TREE:
        description: 'Device Tree Repository'
        required: true
        default: 'https://github.com/whatawurst/android_device_sony_maple'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12.1'
      COMMON_TREE:
        description: 'Common Device Tree Repository'
        required: true
        default: 'https://github.com/whatawurst/android_device_sony_yoshino-common'
      COMMON_TREE_BRANCH:
        description: 'Common Device Tree Branch'
        required: true
        default: 'android-12.1'
      FOX_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
      BUILD_TARGET:
        description: 'Build Target (recoveryimage, bootimage, or both)'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
          - recoveryimage
          - bootimage
          - both

jobs:
  build:
    name: Build OrangeFox R12.1 for ${{ github.event.inputs.DEVICE_NAME }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Maximize Storage)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          docker rmi $(docker images -q) -f 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y > /dev/null 2>&1
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Swap Space (16 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2 \
            libxml2-utils xsltproc unzip fontconfig libssl-dev bc rsync \
            python3 python3-pip openjdk-11-jdk jq libncurses5-dev libelf-dev
          
          # Setup Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui true

          # Install Repo tool
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync OrangeFox R12.1 Source Tree
        run: |
          mkdir -p $GITHUB_WORKSPACE/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          cd ~/orangefox_sync
          bash orangefox_sync.sh --branch ${{ github.event.inputs.FOX_BRANCH }} --path $GITHUB_WORKSPACE/fox_12.1

      - name: Clone Device and Common Trees
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1
          echo "Cloning Device Tree (${{ github.event.inputs.DEVICE_NAME }})..."
          git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/sony/${{ github.event.inputs.DEVICE_NAME }}
          
          echo "Cloning Common Tree (yoshino-common)..."
          git clone --depth=1 ${{ github.event.inputs.COMMON_TREE }} -b ${{ github.event.inputs.COMMON_TREE_BRANCH }} device/sony/yoshino-common

      - name: Configure OrangeFox Environment Flags
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1/device/sony/${{ github.event.inputs.DEVICE_NAME }}
          
          # Ensure vendorsetup.sh exists with necessary OrangeFox R12 build flags
          cat << 'EOF' >> vendorsetup.sh

          # OrangeFox specific settings for Sony Xperia XZ Premium (maple)
          export FOX_BUILD_DEVICE="maple"
          export OF_MAINTAINER="Legends08"
          export FOX_MAINTAINER_PATCH_VERSION="1"
          export FOX_BUILD_TYPE="Unofficial"
          export ALLOW_MISSING_DEPENDENCIES=true
          export TW_DEVICE_VERSION="R12.1"
          export TARGET_DEVICE="maple"

          # Display & UI flags (1080x1920)
          export OF_SCREEN_H=1920
          export OF_STATUS_H=80
          export OF_STATUS_INDENT_LEFT=48
          export OF_STATUS_INDENT_RIGHT=48
          export OF_ALLOW_DISABLE_NAVBAR=0

          # OrangeFox Engine Features
          # NOTE: OF_USE_MAGISKBOOT, OF_USE_MAGISKBOOT_FOR_ALL_PATCHES,
          # OF_DONT_PATCH_ENCRYPTED_DEVICE are auto-enabled in orangefox.mk R12.0+
          export OF_NO_TREBLE_COMPATIBILITY_CHECK=1
          export OF_SKIP_ORANGEFOX_PROCESS=0
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_ADVANCED_SECURITY=1
          export FOX_ENABLE_APP_MANAGER=1
          export OF_PATCH_AVB20=1
          export OF_SUPPORT_ALL_BLOCK_OTA_UPDATES=1
          export OF_FIX_OTA_UPDATE_MANUAL_FLASHING=1

          EOF
          chmod +x vendorsetup.sh
          cat vendorsetup.sh

      - name: Build OrangeFox Recovery
        run: |
          cd $GITHUB_WORKSPACE/fox_12.1
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          
          echo "=== Invoking lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng ==="
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng || lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-userdebug
          
          TARGET="${{ github.event.inputs.BUILD_TARGET }}"
          echo "=== Building target: $TARGET ==="
          if [ "$TARGET" = "both" ]; then
            mka recoveryimage bootimage -j$(nproc --all)
          else
            mka $TARGET -j$(nproc --all)
          fi

      - name: Locate and Prepare Build Outputs
        id: prepare_outputs
        run: |
          OUTPUT_DIR="$GITHUB_WORKSPACE/fox_12.1/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          DEST_DIR="$GITHUB_WORKSPACE/build_output"
          mkdir -p $DEST_DIR
          
          echo "=== Listing Output Files ==="
          ls -la $OUTPUT_DIR || true
          
          # Copy OrangeFox Zip
          cp -v $OUTPUT_DIR/OrangeFox-*.zip $DEST_DIR/ 2>/dev/null || true
          
          # Copy Recovery Image
          cp -v $OUTPUT_DIR/recovery.img $DEST_DIR/ 2>/dev/null || true
          
          # Copy Boot Image
          cp -v $OUTPUT_DIR/boot.img $DEST_DIR/ 2>/dev/null || true

          # Check if anything was copied
          COUNT=$(ls -1 $DEST_DIR | wc -l)
          if [ "$COUNT" -eq "0" ]; then
            echo "ERROR: No build output files found!"
            exit 1
          fi
          
          echo "Generated artifacts in $DEST_DIR:"
          ls -lh $DEST_DIR

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12.1-${{ github.event.inputs.DEVICE_NAME }}
          path: build_output/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-R12.1-${{ github.run_number }}
          name: OrangeFox Recovery R12.1 for Sony Xperia XZ Premium (${{ github.event.inputs.DEVICE_NAME }})
          body: |
            ## OrangeFox Recovery R12.1 (fox_12.1)
            - **Device**: Sony Xperia XZ Premium (`${{ github.event.inputs.DEVICE_NAME }}`)
            - **Platform**: Yoshino (Qualcomm Snapdragon 835 MSM8998)
            - **Common Tree**: [android_device_sony_yoshino-common](${{ github.event.inputs.COMMON_TREE }}) (`${{ github.event.inputs.COMMON_TREE_BRANCH }}`)
            - **Device Tree**: [android_device_sony_maple](${{ github.event.inputs.DEVICE_TREE }}) (`${{ github.event.inputs.DEVICE_TREE_BRANCH }}`)
            - **Maintainer**: Legends08
            
            ### Flash Instructions:
            1. **Fastboot**:
               ```bash
               fastboot flash recovery recovery.img
               # Hoặc flash vào FOTAKernel (Sony recovery partition):
               fastboot flash FOTAKernel recovery.img
               # Hoặc boot tạm thời để test:
               fastboot boot recovery.img
               ```
            2. **Recovery (TWRP/OrangeFox Zip)**:
               - Flash file `OrangeFox-*.zip` trực tiếp từ TWRP/OrangeFox đang chạy.
          files: build_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
