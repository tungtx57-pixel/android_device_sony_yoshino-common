name: Build AERA Recovery (Sony Yoshino)

on:
  push:
    branches:
      - aera-16.0
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: 'Target Device Codename (maple, poplar, lilac)'
        required: true
        default: 'maple'
        type: string
      DEVICE_TREE:
        description: 'Device Tree Repository URL'
        required: true
        default: 'https://github.com/tungtx57-pixel/android_device_sony_maple'
        type: string
      DEVICE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12.1'
        type: string
      YOSHINO_BRANCH:
        description: 'Yoshino Common Branch'
        required: true
        default: 'aera-16.0'
        type: string
      AERA_BRANCH:
        description: 'AERA Recovery Manifest Branch'
        required: true
        default: 'aera-16.0'
        type: string
      BUILD_TARGET:
        description: 'Build Target (recoveryimage or bootimage)'
        required: true
        default: 'recoveryimage'
        type: choice
        options:
          - recoveryimage
          - bootimage
      MAINTAINER:
        description: 'AERA Maintainer Name'
        required: true
        default: 'tungtx57-pixel'
        type: string
      ENABLE_ROOT_MANAGER:
        description: 'Pack offline KernelSU/SukiSU LKM providers (keep false for 64 MiB recovery slot)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: AERA Recovery - ${{ inputs.DEVICE_NAME || 'maple' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      GIT_TERMINAL_PROMPT: 0
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C

    steps:
      - name: Checkout Sony Yoshino Common Tree (${{ inputs.YOSHINO_BRANCH || 'aera-16.0' }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.YOSHINO_BRANCH || 'aera-16.0' }}
          path: yoshino-common-repo

      - name: Maximize Runner Disk Space & Configure ZRAM + Swap
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/graalvm \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/lib/jvm/temurin-* \
            /usr/local/sqlpackage
          sudo docker system prune --all --force --volumes || true
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile

          # 1. Setup 8 GiB ZRAM (high-priority in-RAM compressed swap, pri=100)
          if sudo modprobe zram num_devices=1 2>/dev/null; then
            echo lz4 | sudo tee /sys/block/zram0/comp_algorithm 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize
            sudo mkswap /dev/zram0
            sudo swapon -p 100 /dev/zram0
          fi

          # 2. Setup 16 GiB fallback disk swap (low-priority, pri=10)
          SWAP_PATH="/mnt/swapfile"
          if ! sudo fallocate -l 16G "${SWAP_PATH}" 2>/dev/null; then
            SWAP_PATH="/swapfile"
            sudo fallocate -l 16G "${SWAP_PATH}"
          fi
          sudo chmod 600 "${SWAP_PATH}"
          sudo mkswap "${SWAP_PATH}"
          sudo swapon -p 10 "${SWAP_PATH}"
          sudo sysctl vm.swappiness=10
          df -h
          free -h
          swapon --show

      - name: Install AOSP 16 / AERA Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop openjdk-17-jdk pngcrush python3 python-is-python3 \
            rsync schedtool squashfs-tools tmux unzip xsltproc zip zlib1g-dev zstd

          sudo mkdir -p /usr/local/bin
          sudo curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false
          git lfs install

      - name: Sync AERA Recovery Manifest (${{ inputs.AERA_BRANCH || 'aera-16.0' }})
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/aera"
          cd "${GITHUB_WORKSPACE}/aera"

          repo init \
            -u https://github.com/AERA-Recovery/android_manifest.git \
            -b "${{ inputs.AERA_BRANCH || 'aera-16.0' }}" \
            -g default,-mips,-darwin,-notdefault \
            --depth=1 \
            --git-lfs

          # Exclude unused prebuilt GKI kernels and ABI dumps left in default.xml
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/slim_ci.xml << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project path="kernel/prebuilts/6.1/arm64" />
            <remove-project path="kernel/prebuilts/6.6/arm64" />
            <remove-project path="kernel/prebuilts/6.12/arm64" />
            <remove-project path="kernel/prebuilts/common-modules/trusty/6.6/arm64" />
            <remove-project path="kernel/prebuilts/common-modules/trusty/6.12/arm64" />
            <remove-project path="prebuilts/abi-dumps/ndk" />
            <remove-project path="prebuilts/abi-dumps/platform" />
            <remove-project path="prebuilts/abi-dumps/vndk" />
            <remove-project path="prebuilts/bazel/darwin-x86_64" />
          </manifest>
          XMLEOF

          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags || \
            repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Setup Sony Yoshino Device Trees, Apply Patches & Reclaim .repo Space
        run: |
          cd "${GITHUB_WORKSPACE}/aera"

          DEVICE_NAME="${{ inputs.DEVICE_NAME || 'maple' }}"
          DEVICE_TREE="${{ inputs.DEVICE_TREE || 'https://github.com/tungtx57-pixel/android_device_sony_maple' }}"
          DEVICE_BRANCH="${{ inputs.DEVICE_BRANCH || 'android-12.1' }}"

          rm -rf "device/sony/yoshino-common" "device/sony/${DEVICE_NAME}"
          mkdir -p "device/sony"

          # Copy the remade yoshino-common repository checked out by this workflow
          cp -a "${GITHUB_WORKSPACE}/yoshino-common-repo" "device/sony/yoshino-common"
          rm -rf "${GITHUB_WORKSPACE}/yoshino-common-repo"

          # Clone target device tree (maple / poplar / lilac)
          git clone --depth=1 -b "${DEVICE_BRANCH}" "${DEVICE_TREE}" "device/sony/${DEVICE_NAME}"

          # Normalize device tree makefiles for AERA 16.0 (AOSP 16 bp2a)
          python3 - "device/sony/${DEVICE_NAME}" "${DEVICE_NAME}" << 'PYEOF'
          import os
          import sys

          dev_dir, dev_name = sys.argv[1], sys.argv[2]

          # 1. Normalize twrp_<device>.mk for AOSP 16 / AERA 16.0
          mk_path = os.path.join(dev_dir, f"twrp_{dev_name}.mk")
          if os.path.isfile(mk_path):
              with open(mk_path, "r", encoding="utf-8") as f:
                  mk = f.read()

              mk = mk.replace("core_64_bit_only.mk", "core_64_bit.mk")
              if "emulated_storage.mk" not in mk:
                  mk = mk.replace(
                      "$(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)",
                      "$(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)\n"
                      "$(call inherit-product, $(SRC_TARGET_DIR)/product/emulated_storage.mk)",
                  )
              if "device/sony/yoshino-common/platform.mk" not in mk:
                  mk += "\n# Inherit Sony Yoshino common AERA platform configuration\n"
                  mk += "$(call inherit-product, device/sony/yoshino-common/platform.mk)\n"
              if "PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE" not in mk:
                  mk += "PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false\n"
              if "PRODUCT_SHIPPING_API_LEVEL" not in mk:
                  mk += "PRODUCT_SHIPPING_API_LEVEL := 25\n"

              with open(mk_path, "w", encoding="utf-8") as f:
                  f.write(mk)
              print(f"[setup] Updated {mk_path} for AERA 16.0")

          # 2. Normalize AndroidProducts.mk for bp2a lunch combos
          ap_path = os.path.join(dev_dir, "AndroidProducts.mk")
          if os.path.isfile(ap_path):
              with open(ap_path, "r", encoding="utf-8") as f:
                  ap = f.read()
              bp2a_choice = f"twrp_{dev_name}-bp2a-eng"
              if bp2a_choice not in ap:
                  ap = ap.replace(
                      f"twrp_{dev_name}-eng",
                      f"{bp2a_choice} \\\n    twrp_{dev_name}-eng",
                  )
                  with open(ap_path, "w", encoding="utf-8") as f:
                      f.write(ap)
                  print(f"[setup] Added {bp2a_choice} to {ap_path}")

          # 3. Ensure init.recovery.qcom.rc imports QCOM FBE decrypt rc
          qcom_rc = os.path.join(dev_dir, "recovery", "root", "init.recovery.qcom.rc")
          if os.path.isfile(qcom_rc):
              with open(qcom_rc, "r", encoding="utf-8") as f:
                  rc = f.read()
              if "init.recovery.qcom_decrypt.rc" not in rc:
                  rc = "import /init.recovery.qcom_decrypt.rc\n\n" + rc
              rc = rc.replace("    start sbinqseecomd\n", "")
              with open(qcom_rc, "w", encoding="utf-8") as f:
                  f.write(rc)
              print(f"[setup] Normalized {qcom_rc} for QCOM FBE decryption")
          PYEOF

          # Apply MSM8998 Linux 4.4 fscrypt v1, 64 MiB font budget, and soong_build 11 GiB memory cap patches
          bash "device/sony/yoshino-common/patches/apply.sh" "${GITHUB_WORKSPACE}/aera"

          # Make bootable/recovery/.git standalone so git revision queries work, then remove .repo (~42 GB freed)
          if [ -d "bootable/recovery/.git" ]; then
            cp -RL "bootable/recovery/.git" "bootable/recovery/.git_standalone"
            rm -rf "bootable/recovery/.git"
            mv "bootable/recovery/.git_standalone" "bootable/recovery/.git"
          fi
          rm -rf .repo
          df -h

      - name: Build AERA Recovery
        run: |
          cd "${GITHUB_WORKSPACE}/aera"

          DEVICE_NAME="${{ inputs.DEVICE_NAME || 'maple' }}"
          BUILD_TARGET="${{ inputs.BUILD_TARGET || 'recoveryimage' }}"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export GOGC=40
          export GOMEMLIMIT=11GiB
          export AERA_BUILD_DEVICE="${DEVICE_NAME}"
          export AERA_MAINTAINER="${{ inputs.MAINTAINER || 'tungtx57-pixel' }}"
          if [ "${{ inputs.ENABLE_ROOT_MANAGER }}" = "true" ]; then
            export AERA_ENABLE_ROOT_MANAGER=1
          else
            export AERA_ENABLE_ROOT_MANAGER=0
          fi

          source build/envsetup.sh
          lunch "twrp_${DEVICE_NAME}-bp2a-eng"
          mka adbd "${BUILD_TARGET}" -j"$(nproc --all)"

      - name: Collect Build Outputs & Generate Checksums
        id: collect
        run: |
          DEVICE_NAME="${{ inputs.DEVICE_NAME || 'maple' }}"
          OUT_DIR="${GITHUB_WORKSPACE}/aera/out/target/product/${DEVICE_NAME}"
          RELEASE_DIR="${GITHUB_WORKSPACE}/release_out"
          mkdir -p "${RELEASE_DIR}"

          ls -lh "${OUT_DIR}"

          for pattern in "AERA-*.zip" "AERA-*.zip.md5" "AERA-*.img" "recovery.img" "boot.img"; do
            for f in "${OUT_DIR}"/${pattern}; do
              if [ -f "$f" ]; then
                cp -v "$f" "${RELEASE_DIR}/"
              fi
            done
          done

          cd "${RELEASE_DIR}"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "release_dir=${RELEASE_DIR}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%Y%m%d-%H%M)" >> "${GITHUB_OUTPUT}"

      - name: Upload AERA Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-${{ inputs.DEVICE_NAME || 'maple' }}-${{ steps.collect.outputs.build_date }}
          path: ${{ steps.collect.outputs.release_dir }}/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AERA-${{ inputs.DEVICE_NAME || 'maple' }}-${{ steps.collect.outputs.build_date }}
          name: AERA Recovery 16.0 (${{ inputs.DEVICE_NAME || 'maple' }}) - ${{ steps.collect.outputs.build_date }}
          body: |
            ### AERA Recovery 16.0 Build for Sony Yoshino (`${{ inputs.DEVICE_NAME || 'maple' }}`)
            - **Manifest Branch**: `${{ inputs.AERA_BRANCH || 'aera-16.0' }}`
            - **Device Tree**: `${{ inputs.DEVICE_TREE || 'https://github.com/tungtx57-pixel/android_device_sony_maple' }}` (`${{ inputs.DEVICE_BRANCH || 'android-12.1' }}`)
            - **Build Target**: `${{ inputs.BUILD_TARGET || 'recoveryimage' }}`
            - **Maintainer**: `${{ inputs.MAINTAINER || 'tungtx57-pixel' }}`
          files: ${{ steps.collect.outputs.release_dir }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
